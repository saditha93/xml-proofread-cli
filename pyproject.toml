[project]
name = "xml-proofread"
version = "0.1.0"
description = "Proofread <p> elements in XML files with Gemini and inject <error> annotations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.0",
    "lxml>=5.0",
]

[project.scripts]
xml-proofread = "xml_proofread.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xml_proofread"]

[tool.pytest.ini_options]
testpaths = ["tests"]
